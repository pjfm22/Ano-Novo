<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensagem no Envelope</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .envelope {
      width: 200px;
      height: 130px;
      position: relative;
      background: #f3f4f6;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.6s ease;
    }.flap {
  position: absolute;
  top: 0;
  width: 100%;
  height: 100%;
  background: #e5e7eb;
  clip-path: polygon(0 0, 100% 0, 50% 60%);
  transform-origin: top;
  transition: transform 0.6s ease;
}

.closed .flap {
  transform: rotateX(180deg);
}

.message {
  transition: all 0.6s ease;
}

.hidden-message {
  opacity: 0;
  transform: translateY(-20px);
}

.lock {
  opacity: 0;
  transition: opacity 0.6s ease;
}

.show-lock {
  opacity: 1;
}

  </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen text-white">  <div class="text-center space-y-6"><div id="message" class="message text-lg">
  "Um dia ainda vamos nos encontrar escreve isso…😔❤️"
</div>

<button onclick="guardarMensagem()" class="px-6 py-2 bg-pink-500 rounded-xl hover:bg-pink-600 transition">
  Guardar mensagem
</button>

<div id="envelope" class="envelope mx-auto">
  <div class="flap"></div>
</div>

<div id="lock" class="lock text-xl">
  🔒(. . .)🔒
</div>

<div id="success" class="text-green-400 opacity-0 transition-opacity duration-700">
  guardado com sucesso
</div>

  </div>  <script>
    function guardarMensagem() {
      const msg = document.getElementById('message');
      const envelope = document.getElementById('envelope');
      const lock = document.getElementById('lock');
      const success = document.getElementById('success');

      msg.classList.add('hidden-message');

      setTimeout(() => {
        envelope.classList.add('closed');
        lock.classList.add('show-lock');
      }, 600);

      setTimeout(() => {
        success.style.opacity = 1;
      }, 1200);
    }
  </script></body>
</html>
